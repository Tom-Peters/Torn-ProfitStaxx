name: ProfitStaxx Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check ProfitStaxx.user.js
      - name: Unit tests
        run: node --test tests/*.test.js
